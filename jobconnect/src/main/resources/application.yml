server:
  port: 8080

spring:
  application:
    name: jobconnect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:ahad12345}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Base64 encoded key (min 32 bytes). Override with JWT_SECRET in production.
    secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3Itam9iY29ubmVjdC1wcm9qZWN0LTIwMjY=}
    expiration-ms: 86400000
  admin:
    name: Admin
    email: ${ADMIN_EMAIL:admin@jobconnect.com}
    password: ${ADMIN_PASSWORD:Admin@123}
